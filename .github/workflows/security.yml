name: Security pipeline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Install checksum-verified scanners
        run: bash scripts/install-tools.sh
      - name: Secret scan
        id: secrets
        if: ${{ !cancelled() }}
        run: bash scripts/scan.sh secrets
      - name: Dependency scan
        id: vulnerabilities
        if: ${{ !cancelled() }}
        run: bash scripts/scan.sh vulnerabilities
      - name: Test detection and false-positive controls
        id: detection
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_detection.py
      - name: Preserve scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish job summary
        if: ${{ always() }}
        env:
          SECRET_STATUS: ${{ steps.secrets.outcome }}
          VULN_STATUS: ${{ steps.vulnerabilities.outcome }}
          DETECTION_STATUS: ${{ steps.detection.outcome }}
        run: |
          {
            echo '## Security scan results'
            echo "Secrets: $SECRET_STATUS"
            echo "Dependencies: $VULN_STATUS"
            echo "Detection tests: $DETECTION_STATUS"
            echo 'Download security-reports for JSON evidence. Failed scans require triage.'
          } >> "$GITHUB_STEP_SUMMARY"
